<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SOFT RESTAURANTE</title>
    <!-- El navegador recibe el manifiesto correcto antes de cargar React o permitir instalar.
         En una tablet (pantalla táctil sin mouse) siempre se instala la versión tablet. -->
    <link id="manifest" rel="manifest" />
    <script>
      document.getElementById('manifest').setAttribute('href',
        /^\/tablet(?:\/|$)/.test(window.location.pathname) || window.matchMedia('(hover: none) and (pointer: coarse)').matches
          ? '/manifest-tablet.webmanifest'
          : '/manifest.webmanifest');
    </script>
    <meta name="theme-color" content="#ff7518" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/cenaduria-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/cenaduria-apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SOFT RESTAURANTE" />
    <meta name="description" content="SOFT RESTAURANTE de Cenaduría Los Diablitos: cuentas, comandas, cobros y turnos de caja." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-100 text-neutral-900 antialiased font-sans select-none min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
